name: Release

# Releases are automatic: every push to main (a merged pull request) whose pyproject version has no
# GitHub release yet publishes v<version>. So bump the version in pyproject.toml and sasori/cli.py
# to release; merges that keep the version only run the version check. Pushing a tag like v0.4.0, or
# pushing the commit to the `release` branch (git push origin main:release), also publishes. The
# release has:
#   - sasori-<v>-py3-none-any.whl + sdist  (pip/uv install; pulls the right bpy wheel per platform)
#   - self-contained bundles (Python 3.13 + bpy + sasori) for Linux x64, macOS arm64,
#     Windows x64 and Windows arm64, each smoke-tested on its own runner
#   - SHA256SUMS.txt
# Pull requests that touch packaging run it as a dry run (build and smoke-test every bundle, no
# release), and so does Actions > Release > Run workflow.

on:
  push:
    tags: ["v*"]
    branches: [main, release]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - tools/make_bundle.py
      - tools/smoke_test.py
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

# Two quick merges queue rather than race to create the same release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    # Before a release, and on manual dry runs. On pull requests the CI workflow already runs them.
    needs: dist
    if: needs.dist.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml

  dist:
    name: Wheel and sdist
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.new.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Check versions agree
        id: version
        shell: python
        run: |
          import os, re, tomllib
          v = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          cli = re.search(r'^VERSION = "(.+)"', open("sasori/cli.py").read(), re.M).group(1)
          assert cli == v, f"sasori/cli.py VERSION {cli} != pyproject.toml version {v}"
          ref = os.environ["GITHUB_REF"]
          if ref.startswith("refs/tags/"):
              tag = ref.removeprefix("refs/tags/")
              assert tag == f"v{v}", f"tag {tag} does not match pyproject.toml version {v} (expected v{v})"
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"version={v}\n")
      - name: Is this a new version?
        id: new
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.version }}
        run: |
          # tags and the release branch always publish; main publishes only a version not yet released
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            if gh release view "v$V" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "v$V is already released: nothing to publish (bump the version to release)"
              publish=false
            else
              echo "v$V has no release yet: publishing it"
              publish=true
            fi
          elif [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_REF" == refs/heads/release ]]; then
            publish=true
          else
            publish=false   # pull request or manual run: dry run
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  bundle:
    name: Bundle (${{ matrix.target }})
    needs: dist
    # skipped on merges that don't change the version
    if: needs.dist.outputs.publish == 'true' || github.event_name != 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64, ext: tar.gz, launcher: sasori }
          - { os: macos-latest, target: macos-arm64, ext: tar.gz, launcher: sasori }
          - { os: windows-latest, target: windows-x64, ext: zip, launcher: sasori.cmd }
          - { os: windows-11-arm, target: windows-arm64, ext: zip, launcher: sasori.cmd }
    timeout-minutes: 45
    env:
      NAME: sasori-${{ needs.dist.outputs.version }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist
      - name: Build bundle
        shell: bash
        run: |
          uv run --no-project --python 3.13 tools/make_bundle.py \
            --wheel dist/sasori-${{ needs.dist.outputs.version }}-py3-none-any.whl \
            --name "$NAME" --version ${{ needs.dist.outputs.version }} --out bundles
      - name: Unpack and smoke-test
        shell: bash
        run: |
          mkdir unpacked
          if [ "${{ matrix.ext }}" = zip ]; then
            7z x -bd -ounpacked "bundles/$NAME.zip" > /dev/null
          else
            tar -xzf "bundles/$NAME.tar.gz" -C unpacked
          fi
          uv run --no-project --python 3.13 tools/smoke_test.py "unpacked/$NAME/${{ matrix.launcher }}"
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: bundles/${{ env.NAME }}.${{ matrix.ext }}
          compression-level: 0

  release:
    name: Publish GitHub release
    if: needs.dist.outputs.publish == 'true'
    needs: [test, dist, bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: v${{ needs.dist.outputs.version }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          ## Download

          | platform | file |
          |---|---|
          | Linux x64 | \`sasori-${{ needs.dist.outputs.version }}-linux-x64.tar.gz\` |
          | macOS Apple Silicon | \`sasori-${{ needs.dist.outputs.version }}-macos-arm64.tar.gz\` |
          | Windows x64 | \`sasori-${{ needs.dist.outputs.version }}-windows-x64.zip\` |
          | Windows ARM64 | \`sasori-${{ needs.dist.outputs.version }}-windows-arm64.zip\` |
          | any (pip / uv, Python 3.13) | \`sasori-${{ needs.dist.outputs.version }}-py3-none-any.whl\` |

          The bundles include Python 3.13 and Blender's bpy, so nothing else is needed. Unpack and run \`./sasori schema\` (\`sasori.cmd schema\` on Windows).
          Full instructions: https://github.com/${{ github.repository }}/blob/main/docs/installation.md

          NOTES
          # Creates the tag at this commit when it came from main or the release branch; fails if the
          # release exists.
          gh release create "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "sasori $TAG" --notes-file notes.md --generate-notes

  pypi:
    name: Publish to PyPI
    # Off until PyPI trusted publishing is set up (docs/releasing.md); then set the repo variable PUBLISH_PYPI=true.
    if: needs.dist.outputs.publish == 'true' && vars.PUBLISH_PYPI == 'true'
    needs: [test, dist, bundle]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
