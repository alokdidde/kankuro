[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ccreator"
version = "0.1.0"
description = "Agent-friendly character creator CLI: MakeHuman body + Mesh2Motion skeleton, built with Blender (bpy)"
requires-python = ">=3.13,<3.14"
dependencies = ["bpy==5.2.*", "numpy", "pillow"]

[project.scripts]
ccreator = "ccreator.cli:main"

[tool.setuptools.packages.find]
include = ["ccreator*"]

[tool.setuptools.package-data]
ccreator = ["data/*", "data/*/*"]
